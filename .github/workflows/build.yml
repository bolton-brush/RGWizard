name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/build.yml'
      - 'RGWizard.spec'
      - 'main.py'
      - 'model_manager.py'
      - 'legacy_fastcore/**'
      - 'models/**'
      - 'requirements.txt'

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_name: RGWizard-linux-x64
          - os: windows-2025
            artifact_name: RGWizard-windows-x64
          - os: macos-15
            artifact_name: RGWizard-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 tk xvfb xauth
          sudo apt-get install -y upx-ucl || sudo apt-get install -y upx

      - name: Install UPX on macOS
        if: runner.os == 'macOS'
        run: |
          brew install upx

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install CPU-only PyTorch on Linux
        if: runner.os == 'Linux'
        run: |
          python -m pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch==2.12.1 torchvision==0.27.1

      - name: Install Python dependencies
        run: |
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Verify LFS model and imports
        run: |
          git lfs fsck
          python -m py_compile main.py model_manager.py legacy_fastcore/__init__.py legacy_fastcore/dispatch.py legacy_fastcore/transform.py
          python -c "import setuptools; from packaging.version import Version; assert Version(setuptools.__version__) >= Version('78.1.1'), setuptools.__version__"
          python -c "from model_manager import ModelManager; m = ModelManager('models'); assert m.get_model(target='LC', task='fliprot') is not None"

      - name: Verify Linux build does not include CUDA wheels
        if: runner.os == 'Linux'
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('nvidia') is None"

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm RGWizard.spec

      - name: Smoke test Linux bundle startup
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python -c "import subprocess; subprocess.run(['dist/RGWizard/RGWizard', '--smoke-test'], timeout=30, check=True)"

      - name: Smoke test Windows bundle startup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "import subprocess, time; start=time.perf_counter(); subprocess.run([r'dist\RGWizard\RGWizard.exe', '--smoke-test'], timeout=180, check=True); print(f'Windows smoke test completed in {time.perf_counter() - start:.1f}s')"

      - name: Smoke test macOS bundle startup
        if: runner.os == 'macOS'
        run: |
          python -c "import subprocess; subprocess.run(['dist/RGWizard.app/Contents/MacOS/RGWizard', '--smoke-test'], timeout=30, check=True)"

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent dist/RGWizard.app artifacts/${{ matrix.artifact_name }}.zip

      - name: Package Linux app
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          tar -czf artifacts/${{ matrix.artifact_name }}.tar.gz -C dist RGWizard

      - name: Package Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts
          Compress-Archive -Path dist/RGWizard -DestinationPath artifacts/${{ matrix.artifact_name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/* --title "$TAG_NAME" --generate-notes --verify-tag
          fi
